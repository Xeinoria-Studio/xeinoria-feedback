name: Proposer une idée
description: Une feature, une amélioration, une idée d'évènement.
title: "[Idée] "
labels: ["enhancement", "triage"]
body:
  - type: dropdown
    id: server
    attributes:
      label: Serveur ou partie du réseau concernée
      options:
        - Hub
        - Survie
        - Créatif
        - NWLand
        - Réseau global
        - Site web
        - Autre
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: L'idée en une phrase
      placeholder: "Ajouter un système de quêtes journalières sur Survie."
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Pourquoi
      description: Quel problème ça résout, ou qu'est-ce que ça apporte aux joueurs ?
      placeholder: "Donner une raison de se connecter tous les jours, et débloquer des items cosmétiques."

  - type: textarea
    id: how
    attributes:
      label: Comment vous l'imaginez
      description: Optionnel — si vous avez déjà pensé à des détails.
