name: Signaler un bug
description: Quelque chose ne marche pas comme attendu.
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de signaler ce bug. Plus vous donnez de détails, plus vite il sera corrigé.

  - type: dropdown
    id: server
    attributes:
      label: Serveur concerné
      options:
        - Hub
        - Survie
        - Créatif
        - Norath World (nwland)
        - Proxy / Lobby de connexion
        - Plusieurs
        - Je ne sais pas
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: Que s'est-il passé ?
      description: Décrivez ce qui n'a pas marché.
      placeholder: "Quand je fais /home, je suis téléporté à 0,0 au lieu de mon spawn."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      placeholder: "Je devrais être téléporté à la position que j'ai sauvegardée."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      description: Liste précise des actions.
      placeholder: |
        1. Aller sur Survie
        2. Taper /sethome maison
        3. Taper /home maison
        4. Observer la téléportation foireuse
    validations:
      required: true

  - type: input
    id: when
    attributes:
      label: Date et heure approximative
      placeholder: "27/05/2026 vers 22h30"

  - type: input
    id: pseudo
    attributes:
      label: Pseudo Minecraft
      placeholder: "Shamallow_"

  - type: textarea
    id: extras
    attributes:
      label: Captures, logs, vidéos
      description: Glissez-déposez les fichiers ou collez les liens.
